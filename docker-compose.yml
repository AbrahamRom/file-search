services:
  # ============================================================================
  # SERVIDORES DNS CON ALTA DISPONIBILIDAD
  # Todos comparten el alias 'dns' para descubrimiento dinámico
  # El número de instancias es configurable sin cambiar código
  # ============================================================================
  
  # Servidor DNS 1
  dns_1:
    build:
      context: .
      dockerfile: app/dns_service/Dockerfile
    ports:
      - "5353:5353"
    environment:
      - LOG_DIR=/app/logs
      - LOG_LEVEL=INFO
      - DNS_SERVER_ID=dns_1
      - DNS_PORT=5353
      - DNS_ALIAS=dns
      - HEALTH_CHECK_INTERVAL=5
      - SYNC_INTERVAL=30
      - DISCOVERY_INTERVAL=15
      - API_SERVER_TIMEOUT=15
    volumes:
      - ./runtime/logs:/app/logs
    restart: unless-stopped
    networks:
      app_network:
        aliases:
          - dns
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5353/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Servidor DNS 2
  dns_2:
    build:
      context: .
      dockerfile: app/dns_service/Dockerfile
    ports:
      - "5354:5353"
    environment:
      - LOG_DIR=/app/logs
      - LOG_LEVEL=INFO
      - DNS_SERVER_ID=dns_2
      - DNS_PORT=5353
      - DNS_ALIAS=dns
      - HEALTH_CHECK_INTERVAL=5
      - SYNC_INTERVAL=30
      - DISCOVERY_INTERVAL=15
      - API_SERVER_TIMEOUT=15
    volumes:
      - ./runtime/logs:/app/logs
    restart: unless-stopped
    networks:
      app_network:
        aliases:
          - dns
    depends_on:
      - dns_1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5353/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Servidor DNS 3
  dns_3:
    build:
      context: .
      dockerfile: app/dns_service/Dockerfile
    ports:
      - "5355:5353"
    environment:
      - LOG_DIR=/app/logs
      - LOG_LEVEL=INFO
      - DNS_SERVER_ID=dns_3
      - DNS_PORT=5353
      - DNS_ALIAS=dns
      - HEALTH_CHECK_INTERVAL=5
      - SYNC_INTERVAL=30
      - DISCOVERY_INTERVAL=15
      - API_SERVER_TIMEOUT=15
    volumes:
      - ./runtime/logs:/app/logs
    restart: unless-stopped
    networks:
      app_network:
        aliases:
          - dns
    depends_on:
      - dns_1
      - dns_2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5353/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================================
  # SERVIDORES API CON ALTA DISPONIBILIDAD
  # 1 PRIMARY + 2 BACKUPs
  # Los BACKUPs sincronizan datos del PRIMARY cada 10 segundos
  # ============================================================================
  
  # Servidor API 1 (será PRIMARY al iniciar primero)
  server_1:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "8000:8000"
    environment:
      - SERVER_ID=server_1
      - SERVER_PORT=8000
      - FILES_ROOT=/app/files
      - FILES_SOURCE_PATH=/tmp/source_files
      - LOG_DIR=/app/logs
      - DB_PATH=/app/data/doc_search.db
      # Configuración DNS
      - DNS_ALIAS=dns
      - DNS_SERVICE_PORT=5353
      # Configuración de sincronización
      - HEARTBEAT_INTERVAL=5
      - SYNC_INTERVAL=10
    volumes:
      # Archivos fuente (solo lectura, se copian al inicio)
      - ${FILES_SOURCE:-./runtime/files}:/tmp/source_files:ro
      # Logs compartidos
      - ./runtime/logs:/app/logs
    depends_on:
      dns_1:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app_network

  # Servidor API 2 (será BACKUP)
  server_2:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "8001:8000"
    environment:
      - SERVER_ID=server_2
      - SERVER_PORT=8000
      - FILES_ROOT=/app/files
      - FILES_SOURCE_PATH=/tmp/source_files
      - LOG_DIR=/app/logs
      - DB_PATH=/app/data/doc_search.db
      # Configuración DNS
      - DNS_ALIAS=dns
      - DNS_SERVICE_PORT=5353
      # Configuración de sincronización
      - HEARTBEAT_INTERVAL=5
      - SYNC_INTERVAL=10
    volumes:
      # Archivos fuente (solo lectura, se copian al inicio)
      - ${FILES_SOURCE:-./runtime/files}:/tmp/source_files:ro
      # Logs compartidos
      - ./runtime/logs:/app/logs
    depends_on:
      dns_1:
        condition: service_healthy
      server_1:
        condition: service_started
    restart: unless-stopped
    networks:
      - app_network

  # Servidor API 3 (será BACKUP)
  server_3:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "8002:8000"
    environment:
      - SERVER_ID=server_3
      - SERVER_PORT=8000
      - FILES_ROOT=/app/files
      - FILES_SOURCE_PATH=/tmp/source_files
      - LOG_DIR=/app/logs
      - DB_PATH=/app/data/doc_search.db
      # Configuración DNS
      - DNS_ALIAS=dns
      - DNS_SERVICE_PORT=5353
      # Configuración de sincronización
      - HEARTBEAT_INTERVAL=5
      - SYNC_INTERVAL=10
    volumes:
      # Archivos fuente (solo lectura, se copian al inicio)
      - ${FILES_SOURCE:-./runtime/files}:/tmp/source_files:ro
      # Logs compartidos
      - ./runtime/logs:/app/logs
    depends_on:
      dns_1:
        condition: service_healthy
      server_1:
        condition: service_started
    restart: unless-stopped
    networks:
      - app_network

  # ============================================================================
  # CLIENTE WEB
  # ============================================================================
  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    depends_on:
      server_1:
        condition: service_started
      dns_1:
        condition: service_healthy
    environment:
      # Alias DNS para descubrimiento dinámico
      - DNS_ALIAS=dns
      - DNS_SERVICE_PORT=5353
      # Servicio objetivo
      - TARGET_SERVICE_NAME=server
      - TARGET_SERVICE_PORT=8000
      # Fallback y configuración de navegador
      - API_BASE_URL=http://server_1:8000
      - BROWSER_API_URL=http://localhost:8000
      # Configuración de reintentos
      - MAX_RETRIES=3
      - RETRY_DELAY=0.5
    ports:
      - "8501:8501"
    restart: unless-stopped
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
