global
    maxconn 2048
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client  60s
    timeout server  60s

# Frontend que expone el puerto público (sin cambiar URL)
frontend streamlit_frontend
    bind *:8501
    default_backend streamlit_clients

# Backend con healthchecks y failover
backend streamlit_clients
    # Chequeo de salud simple; Streamlit sirve la raíz '/'
    option httpchk GET /
    http-check expect status 200
    # En Docker, los nombres de servicio resuelven por DNS a IPs internas
    server client_primary client_primary:8501 check inter 3s fall 2 rise 3
    server client_backup  client_backup:8501  check inter 3s fall 2 rise 3 backup
