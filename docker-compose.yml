services:
  dns_service:
    build:
      context: .
      dockerfile: app/dns_service/Dockerfile
    ports:
      - "5353:5353"
    environment:
      - LOG_DIR=/app/logs
    volumes:
      - ./runtime/logs:/app/logs
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "8000:8000"
    environment:
      - FILES_ROOT=${FILES_ROOT:-/app/files}
      - LOG_DIR=/app/logs
      # Configuración para usar el DNS Service si el servidor necesitara resolver otros servicios
      - DNS_SERVICE_HOST=dns_service
    volumes:
      - ${FILES_SOURCE:-./runtime/files}:/app/files
      - ./runtime/logs:/app/logs
    depends_on:
      - dns_service
    restart: unless-stopped

  client_primary:
    build:
      context: .
      dockerfile: Dockerfile.client
    depends_on:
      - server
      - dns_service
    environment:
      # Variables para el descubrimiento de servicios
      - DNS_SERVICE_HOST=dns_service
      - TARGET_SERVICE_NAME=server
      - TARGET_SERVICE_PORT=8000
      # Fallback y configuración de navegador
      - API_BASE_URL=http://server:8000
      - BROWSER_API_URL=http://localhost:8000
    restart: unless-stopped

  client_backup:
    build:
      context: .
      dockerfile: Dockerfile.client
    depends_on:
      - server
      - dns_service
    environment:
      # Variables para el descubrimiento de servicios
      - DNS_SERVICE_HOST=dns_service
      - TARGET_SERVICE_NAME=server
      - TARGET_SERVICE_PORT=8000
      # Fallback y configuración de navegador
      - API_BASE_URL=http://server:8000
      - BROWSER_API_URL=http://localhost:8000
    restart: unless-stopped

  client_router:
    build:
      context: app/client_router
      dockerfile: Dockerfile
    depends_on:
      - client_primary
      - client_backup
    ports:
      - "8501:8501"
    restart: unless-stopped
